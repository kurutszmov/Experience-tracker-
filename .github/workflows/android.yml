name: Android APK

on:
  push:
    branches: ["**"]
    paths: ["frontend/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Set the repository variable VITE_API_URL (Settings → Secrets and variables → Actions → Variables)
      # to your deployed backend, e.g. https://fintrack-api.onrender.com/api
      - name: Build web app and sync into Android project
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -n "$API_URL" ]; then export VITE_API_URL="$API_URL"; fi
          echo "Using API: ${VITE_API_URL:-$(grep VITE_API_URL .env)}"
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FinTrack-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
